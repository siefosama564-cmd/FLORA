<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flora — Create Account</title>
  <link rel="icon" href="img/coppy-removebg-preview.png" type="image/png" />
  <link rel="stylesheet" href="signup.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ✅ Toast Container مضاف هنا -->
<div id="toast-container" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;"></div>

<div class="auth-layout">
  <div class="auth-panel auth-visual">
    <div class="visual-bg" style="background-image:url('../../img/imgplant-care-5.jpg')"></div>
    <div class="visual-overlay"></div>
    <div class="visual-content">
      <img src="../../coppy-removebg-preview.png" alt="Flora" class="v-logo" />
      <h1 class="v-title" data-en="FLORA" data-ar="فلورا">FLORA</h1>
      <p class="v-tag" data-en="Join the green revolution" data-ar="انضم للثورة الخضراء">Join the green revolution</p>
      <div class="v-stats">
        <div class="vs-item"><span class="vs-num">Free</span><span class="vs-label" data-en="Forever" data-ar="للأبد">Forever</span></div>
        <div class="vs-item"><span class="vs-num">∞</span><span class="vs-label" data-en="Scans" data-ar="فحص">Scans</span></div>
        <div class="vs-item"><span class="vs-num">24/7</span><span class="vs-label" data-en="Support" data-ar="دعم">Support</span></div>
      </div>
    </div>
  </div>

  <div class="auth-panel auth-form-panel">
    <div class="auth-controls">
      <button class="ctrl-btn" id="themeToggle">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="ctrl-btn" id="langToggle"><span id="langLabel">AR</span></button>
    </div>

    <div class="auth-form-wrap">
      <a href="../login/login.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span data-en="Back to Sign In" data-ar="الرجوع لتسجيل الدخول">Back to Sign In</span>
      </a>

      <h2 class="form-title" data-en="Create account" data-ar="إنشاء حساب">Create account</h2>
      <p class="form-sub" data-en="Start diagnosing your plants for free today" data-ar="ابدأ تشخيص نباتاتك مجاناً اليوم">Start diagnosing your plants for free today</p>

      <form class="auth-form" id="signUpForm">



        <div class="name-row">
          <div class="field">
            <label data-en="First name" data-ar="الاسم الأول">First name</label>
            <input type="text" id="firstname" placeholder="John" class="auth-input" required />
          </div>
          <div class="field">
            <label data-en="Last name" data-ar="الاسم الأخير">Last name</label>
            <input type="text" id="lastname" placeholder="Doe" class="auth-input" required />
          </div>
        </div>

        <div class="field">
          <label data-en="Email address" data-ar="البريد الإلكتروني">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" class="auth-input" required />
        </div>

        <!-- ✅ Phone field مضاف - الباك بيتوقعه -->
        <div class="field">
          <label data-en="Phone number" data-ar="رقم الهاتف">Phone number</label>
          <input type="tel" id="phone" placeholder="01XXXXXXXXX" class="auth-input" />
        </div>

        <div class="field">
          <label data-en="Password" data-ar="كلمة المرور">Password</label>
          <div class="input-wrap">
            <input type="password" id="passInput" placeholder="••••••••" class="auth-input" oninput="checkStrength(this.value)" required />
            <button class="eye-btn" id="eyeBtn" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-bar">
            <div class="strength-seg" id="s1"></div>
            <div class="strength-seg" id="s2"></div>
            <div class="strength-seg" id="s3"></div>
            <div class="strength-seg" id="s4"></div>
          </div>
        </div>

        <div class="field">
          <label data-en="Confirm password" data-ar="تأكيد كلمة المرور">Confirm password</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" class="auth-input" required />
        </div>

        <label class="check-label">
          <input type="checkbox" required />
          <span data-en="I agree to the Terms of Service and Privacy Policy" data-ar="أوافق على شروط الخدمة وسياسة الخصوصية">I agree to the Terms of Service and Privacy Policy</span>
        </label>

        <button type="submit" class="submit-btn">
          <span data-en="Create Account" data-ar="إنشاء الحساب">Create Account</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>

        <p class="switch-link">
          <span data-en="Already have an account?" data-ar="لديك حساب بالفعل؟">Already have an account?</span>
          <a href="../login/login.html" data-en="Sign in" data-ar="تسجيل الدخول">Sign in</a>
        </p>
      </form>
    </div>
  </div>
</div>
<script src="signup.js"></script>
</body>
</html>
