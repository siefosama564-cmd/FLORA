<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flora — Reset Password</title>
  <link rel="icon" href="../../img/coppy-removebg-preview.png" type="image/png" />
  <link rel="stylesheet" href="../login/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-form-wrap { animation: fadeSlideIn 0.45s cubic-bezier(0.4,0,0.2,1) both; }
  </style>
</head>
<body>

<div class="auth-layout">
  <!-- Visual Panel -->
  <div class="auth-panel auth-visual">
    <div class="visual-bg" style="background-image:url('../../img/imgplant-care-4.jpg')"></div>
    <div class="visual-overlay"></div>
    <div class="visual-content">
      <img src="../../img/coppy-removebg-preview.png" alt="Flora AI" class="v-logo">
      <h1 class="v-title" data-en="FLORA" data-ar="فلورا">FLORA</h1>
      <p class="v-tag" data-en="Create a new secure password" data-ar="أنشئ كلمة مرور جديدة آمنة">Create a new secure password</p>
      <div class="v-stats">
        <div class="vs-item"><span class="vs-num">98%</span><span class="vs-label" data-en="Accuracy" data-ar="دقة">Accuracy</span></div>
        <div class="vs-item"><span class="vs-num">50K+</span><span class="vs-label" data-en="Users" data-ar="مستخدم">Users</span></div>
        <div class="vs-item"><span class="vs-num">300+</span><span class="vs-label" data-en="Diseases" data-ar="مرض">Diseases</span></div>
      </div>
    </div>
  </div>

  <!-- Form Panel -->
  <div class="auth-panel auth-form-panel">
    <div class="auth-controls">
      <button class="ctrl-btn" id="themeToggle">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="ctrl-btn" id="langToggle"><span id="langLabel">AR</span></button>
    </div>

    <div class="auth-form-wrap">
      <a href="../forget-password/forget-password.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span data-en="Back" data-ar="رجوع">Back</span>
      </a>

      <h2 class="form-title" data-en="Reset password" data-ar="إعادة تعيين كلمة المرور">Reset password</h2>
      <p class="form-sub" data-en="Enter the code we sent to your email, then choose a new password." data-ar="أدخل الرمز الذي أرسلناه إلى بريدك الإلكتروني، ثم اختر كلمة مرور جديدة.">Enter the code we sent to your email, then choose a new password.</p>

      <form class="auth-form" id="resetForm">
        <div class="field">
          <label data-en="Email address" data-ar="البريد الإلكتروني">Email address</label>
          <input type="email" id="emailInput" placeholder="you@example.com" class="auth-input" required />
        </div>

        <div class="field">
          <label data-en="Reset code (from email)" data-ar="رمز الإعادة (من البريد)">Reset code (from email)</label>
          <input type="text" id="otpInput" placeholder="- - - - -" class="auth-input" maxlength="5" inputmode="numeric" required />
        </div>

        <div class="field">
          <label data-en="New password" data-ar="كلمة المرور الجديدة">New password</label>
          <div class="input-wrap">
            <input type="password" id="passInput" placeholder="••••••••" class="auth-input" required />
            <button class="eye-btn" id="eyeBtn1" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label data-en="Confirm new password" data-ar="تأكيد كلمة المرور الجديدة">Confirm new password</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassInput" placeholder="••••••••" class="auth-input" required />
            <button class="eye-btn" id="eyeBtn2" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <span data-en="Reset Password" data-ar="إعادة تعيين كلمة المرور">Reset Password</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>

        <p class="switch-link">
          <span data-en="Remembered your password?" data-ar="تذكرت كلمة مرورك؟">Remembered your password?</span>
          <a href="../login/login.html" data-en="Sign in" data-ar="تسجيل الدخول">Sign in</a>
        </p>
      </form>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:3000/api/v1";
const html = document.documentElement;

// Theme
const savedTheme = localStorage.getItem('flora-theme') || 'dark';
html.setAttribute('data-theme', savedTheme);
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('flora-theme', next);
});

// Language
let lang = localStorage.getItem('flora-lang') || 'en';
applyLang(lang);
document.getElementById('langToggle').addEventListener('click', () => {
  lang = lang === 'en' ? 'ar' : 'en';
  applyLang(lang);
  localStorage.setItem('flora-lang', lang);
});
function applyLang(l) {
  html.setAttribute('data-lang', l);
  html.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('langLabel').textContent = l === 'ar' ? 'EN' : 'AR';
  document.querySelectorAll('[data-en]').forEach(el => {
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    el.textContent = l === 'ar' ? (el.dataset.ar || el.dataset.en) : el.dataset.en;
  });
}

// Pre-fill email from forget-password flow
const savedEmail = localStorage.getItem('resetPasswordEmail');
if (savedEmail) document.getElementById('emailInput').value = savedEmail;

// Eye toggles
document.getElementById('eyeBtn1').addEventListener('click', () => {
  const p = document.getElementById('passInput');
  p.type = p.type === 'password' ? 'text' : 'password';
});
document.getElementById('eyeBtn2').addEventListener('click', () => {
  const p = document.getElementById('confirmPassInput');
  p.type = p.type === 'password' ? 'text' : 'password';
});

// Message helper
function setMsg(msg, isSuccess) {
  let el = document.getElementById('resetMsg');
  if (!el) {
    el = document.createElement('div');
    el.id = 'resetMsg';
    el.style.cssText = 'padding:11px 14px;border-radius:10px;font-size:0.88rem;margin-bottom:14px;font-weight:500;text-align:center;transition:opacity 0.3s;';
    const form = document.getElementById('resetForm');
    form.insertBefore(el, form.firstChild);
  }
  el.style.background = isSuccess ? 'rgba(76,175,80,0.12)' : 'rgba(244,67,54,0.12)';
  el.style.border     = isSuccess ? '1px solid rgba(76,175,80,0.3)' : '1px solid rgba(244,67,54,0.3)';
  el.style.color      = isSuccess ? '#a5d6a7' : '#ef9a9a';
  el.textContent = msg;
  el.style.display = 'block';
}

// Form submit
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email    = document.getElementById('emailInput').value.trim();
  const otp      = document.getElementById('otpInput').value.trim();
  const password = document.getElementById('passInput').value;
  const confirm  = document.getElementById('confirmPassInput').value;

  if (!email || !otp || !password || !confirm) {
    setMsg(lang === 'ar' ? 'يرجى ملء جميع الحقول' : 'Please fill in all fields', false);
    return;
  }
  if (password !== confirm) {
    setMsg(lang === 'ar' ? 'كلمتا المرور غير متطابقتين' : 'Passwords do not match', false);
    return;
  }
  if (password.length < 8) {
    setMsg(lang === 'ar' ? 'كلمة المرور يجب أن تكون 8 أحرف على الأقل' : 'Password must be at least 8 characters', false);
    return;
  }

  const btn  = e.target.querySelector('.submit-btn');
  const span = btn.querySelector('span[data-en]');
  btn.disabled = true;
  btn.style.opacity = '0.65';
  span.textContent = lang === 'ar' ? 'جاري التحديث...' : 'Updating...';

  try {
    const res = await fetch(`${API_BASE}/auth/reset-password`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, otp, password, confirmPassword: confirm })
    });
    const result = await res.json();

    if (res.ok) {
      localStorage.removeItem('resetPasswordEmail');
      setMsg(
        lang === 'ar' ? '✅ تم تغيير كلمة المرور! جاري التحويل لتسجيل الدخول...' : '✅ Password updated! Redirecting to login...',
        true
      );
      setTimeout(() => { window.location.href = '../login/login.html'; }, 1800);
    } else {
      const msg = result.message || '';
      const friendly = lang === 'ar'
        ? (msg.includes('expired') ? 'انتهت صلاحية الرمز، اطلب رمزاً جديداً'
          : msg.includes('invalid') ? 'الرمز غير صحيح'
          : msg || 'حدث خطأ')
        : (msg.includes('expired') ? 'Code expired. Please request a new one'
          : msg.includes('invalid') ? 'Invalid code'
          : msg || 'An error occurred');
      setMsg(friendly, false);
    }
  } catch {
    setMsg(lang === 'ar' ? 'فشل الاتصال بالسيرفر' : 'Cannot connect to server. Is the backend running?', false);
  } finally {
    btn.disabled = false;
    btn.style.opacity = '1';
    span.textContent = lang === 'ar' ? 'إعادة تعيين كلمة المرور' : 'Reset Password';
  }
});
</script>
</body>
</html>
